; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_l476rg

; Réglages communs à toutes les versions
[env]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube
build_flags =
	-Wl,-u,_printf_float
monitor_speed = 115200

; Version utilisée par les boutons de VS Code (LOG_INTERVAL en secondes)
[env:nucleo_l476rg]

; ./build.sh debug : LOG_INTERVAL en secondes, peu optimisé, infos de débogage
[env:debug]
build_unflags = -Os
build_flags =
	${env.build_flags}
	-DMESURES_TEST=1
	-Og
	-g3

; ./build.sh release : LOG_INTERVAL en minutes (spécification), optimisé pour la taille
[env:release]
build_flags =
	${env.build_flags}
	-DMESURES_TEST=0
	-Os
